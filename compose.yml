services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: md-notes-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/var/www/html
      - ./data:/var/www/html/storage/app/private/spaces
    networks:
      - nginx-pm_default

  db:
    image: mysql:8.4
    container_name: md-notes-db
    restart: unless-stopped
    env_file:
      - ./db.env
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - nginx-pm_default

networks:
  nginx-pm_default:
    external: true
